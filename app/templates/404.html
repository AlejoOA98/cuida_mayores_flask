<!--Código de la plantilla 404 para la aplicación web de administración de cuidadores. Esta plantilla extiende de "base.html" y
 define el contenido específico para la página de error 404,
 mostrando un mensaje de recurso no encontrado y un enlace para volver al inicio.-->
{% extends "base.html" %}
{% block title %}Página no encontrada{% endblock %}
{% block content %}
<div class="vacio">
    <h1>Página no encontrada</h1>
    <p>El recurso solicitado no existe o fue eliminado.</p>
    <a class="boton" href="{{ url_for('inicio') }}">Volver al inicio</a>
</div>
{% endblock %}
