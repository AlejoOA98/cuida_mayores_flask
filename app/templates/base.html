<!--Footer y cierre de la plantilla base para la aplicación web de administración de cuidadores. Incluye enlaces a Bootstrap y define la estructura general del documento HTML, incluyendo encabezado, cuerpo y pie de página.-->
<!doctype html>
<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Cuida a tus Mayores{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>
<header class="encabezado">
    <div class="contenedor barra">
        <a class="marca" href="{{ url_for('inicio') }}">Cuida a tus Mayores</a>
        <nav aria-label="Navegación principal">
            <a href="{{ url_for('inicio') }}">Inicio</a>
            <a href="{{ url_for('cuidadores.lista') }}">Cuidadores</a>
            <a class="boton boton-claro" href="{{ url_for('cuidadores.crear') }}">Registrar</a>
        </nav>
    </div>
</header>

<main class="contenedor contenido">
    {% with mensajes = get_flashed_messages(with_categories=true) %}
        {% for categoria, mensaje in mensajes %}
            <div class="alerta alerta-{{ categoria }}" role="alert">{{ mensaje }}</div>
        {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
</main>

<footer class="pie">
    <div class="contenedor">Prototipo .</div>
</footer>
<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>
</body>
</html>
